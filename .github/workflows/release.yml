name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  build:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 so the binary links against an older glibc and runs on older distros
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: server

      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          name=agent-sessions-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}
          mkdir "$name"
          cp server/target/${{ matrix.target }}/release/agent-sessions README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "agent-sessions-$($env:GITHUB_REF_NAME.Replace('/', '-'))-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item server/target/${{ matrix.target }}/release/agent-sessions.exe, README.md, LICENSE $name
          Compress-Archive $name "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            agent-sessions-*.tar.gz
            agent-sessions-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
      - run: sha256sum agent-sessions-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            agent-sessions-*
            SHA256SUMS
