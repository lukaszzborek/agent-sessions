[package]
name = "agent-sessions"
version = "0.1.1"
edition = "2021"
description = "Local web UI over coding-agent session logs (Claude Code, Codex, Pi)"
license = "Apache-2.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
rayon = "1"
walkdir = "2"
dirs = "7"
anyhow = "1"
tower-http = { version = "0.7", features = ["compression-gzip"] }
# only for reading rtk's history.db: turso locks a file exclusively, which would block rtk writing it
rusqlite = { version = "0.40", features = ["bundled"] }
turso = { version = "0.8.1", default-features = false }
pollster = "0.4"
zstd = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
tokio-stream = { version = "0.1", features = ["sync"] }
glob = "0.3.4"
toml = "1.1.6"

[profile.release]
opt-level = 3
lto = "thin"
